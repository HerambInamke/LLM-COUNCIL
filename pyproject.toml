[project]
name = "llm-council"
version = "0.1.0"
description = "A 3-stage deliberation system where multiple LLMs collaboratively answer user questions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LLM Council Contributors" }
]
keywords = ["llm", "ai", "chat", "openrouter", "fastapi", "react"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
